name: conteo_votaciones
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.15.0 
  firebase_database: ^10.0.7
  cloud_firestore: ^4.17.5
  uuid: ^3.0.6
  shared_preferences: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "##FFFFFF"
    theme_color: "#FFFFFF"
    favicon: true  # Esto genera el favicon automáticamente

flutter:
  uses-material-design: true
